<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dự đoán giá nhà</title>
  <link rel="stylesheet" href="house_form.css">
</head>
<body>
  <main class="form-container">
    <h1>Thông tin căn nhà</h1>
    <p class="description">Nhập thông tin để xem kết quả</p>

    <form id="houseForm">
      <div class="form-group">
        <label for="area">Diện tích (m²)</label>
        <input type="number" id="area" name="area" min="1" step="0.1" placeholder="Ví dụ: 80" required>
      </div>

      <div class="form-group">
        <label for="bedrooms">Số phòng ngủ</label>
        <input type="number" id="bedrooms" name="bedrooms" min="1" step="1" placeholder="Ví dụ: 3" required>
      </div>

      <div class="form-group">
        <label for="location">Vị trí</label>
        <input type="text" id="location" name="location" placeholder="Ví dụ: Quận 1, TP. Hồ Chí Minh" required>
      </div>

      <button type="submit">Gửi thông tin</button>
    </form>

    <div id="result" role="status"></div>
  </main>

  <script src="house_form.js"></script>
</body>
</html>
